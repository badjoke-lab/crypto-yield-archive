name: Candidate scan

on:
  workflow_dispatch:
    inputs:
      candidate_file:
        description: Candidate ledger to scan
        required: false
        default: data-staging/candidates/cya-candidates.json
        type: string
  pull_request:
    paths:
      - data-staging/candidates/**
      - scripts/candidate-scanner.mjs
      - scripts/test-candidate-scanner.mjs
      - scripts/fixtures/candidate-scanner.json
      - scripts/lib/registry-files.mjs
      - package.json
      - .github/workflows/candidate-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run scanner fixture tests
        run: npm run test:candidate-scanner

      - name: Scan active candidate ledger
        shell: bash
        env:
          CANDIDATE_FILE: ${{ inputs.candidate_file || 'data-staging/candidates/cya-candidates.json' }}
        run: |
          mkdir -p artifacts
          npm run candidates:scan -- --input "$CANDIDATE_FILE" --output artifacts/candidate-scan.json

      - name: Upload candidate scan
        uses: actions/upload-artifact@v4
        with:
          name: cya-candidate-scan
          path: artifacts/candidate-scan.json
