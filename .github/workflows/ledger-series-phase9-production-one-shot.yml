name: Ledger Series Phase 9 Production One-Shot

on:
  pull_request:
    paths:
      - '.github/workflows/ledger-series-phase9-production-one-shot.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: d5ffd036f52cf4789190c95848979f76ce768423
      GITHUB_SHA: d5ffd036f52cf4789190c95848979f76ce768423
      GITHUB_REF_NAME: main
      BASE_URL: https://cya.badjoke-lab.com
    steps:
      - name: Checkout exact accepted main
        uses: actions/checkout@v7
        with:
          ref: d5ffd036f52cf4789190c95848979f76ce768423

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild and validate exact main
        run: |
          npm test
          node scripts/validate-ledger-series-phase9-adapter.mjs

      - name: Verify production Series contract exhaustively
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const base = process.env.BASE_URL;
          const expectedCommit = process.env.SOURCE_SHA;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchJson(path) {
            const response = await fetch(`${base}${path}?series_audit=${Date.now()}`, {
              headers: { 'cache-control': 'no-cache' },
            });
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
            return response.json();
          }

          let version;
          for (let attempt = 1; attempt <= 40; attempt += 1) {
            try {
              version = await fetchJson('/version.json');
            } catch {
              version = null;
            }
            const observed = version?.build?.commit || '';
            console.log(`production commit ${observed || 'missing'} (${attempt}/40)`);
            if (observed === expectedCommit) break;
            if (attempt === 40) throw new Error(`production did not converge to ${expectedCommit}; observed ${observed || 'missing'}`);
            await sleep(15000);
          }

          const localRegistry = JSON.parse(fs.readFileSync('dist/data/series/registry.json', 'utf8'));
          const localIndex = JSON.parse(fs.readFileSync('dist/data/series/index.json', 'utf8'));
          if (localRegistry.build.commit !== expectedCommit) throw new Error(`local registry commit mismatch: ${localRegistry.build.commit}`);
          if (localIndex.record_count !== 118 || localIndex.records.length !== 118) throw new Error(`expected 118 local Series records, got ${localIndex.records.length}`);

          const prodRegistry = await fetchJson('/data/series/registry.json');
          const prodIndex = await fetchJson('/data/series/index.json');
          if (prodRegistry.build.commit !== expectedCommit || prodIndex.build.commit !== expectedCommit) throw new Error('production Series build commit mismatch');
          if (prodIndex.record_count !== 118 || prodIndex.records.length !== 118) throw new Error(`expected 118 production Series records, got ${prodIndex.records.length}`);

          const globalKeys = prodIndex.records.map((item) => item.global_key);
          if (new Set(globalKeys).size !== 118) throw new Error('production global-key uniqueness failed');

          function normalize(value) {
            if (Array.isArray(value)) return value.map(normalize);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.entries(value)
                .filter(([key]) => key !== 'generated_at')
                .map(([key, child]) => [key, normalize(child)]));
            }
            return value;
          }

          const equal = (a, b) => JSON.stringify(normalize(a)) === JSON.stringify(normalize(b));
          if (!equal(localRegistry, prodRegistry)) throw new Error('registry descriptor semantic mismatch');
          if (!equal(localIndex, prodIndex)) throw new Error('registry index semantic mismatch');

          let verified = 0;
          for (const entry of localIndex.records) {
            const slug = entry.native_key.slug;
            const localPath = `dist/data/series/records/${slug}.json`;
            const localEnvelope = JSON.parse(fs.readFileSync(localPath, 'utf8'));
            const prodEnvelope = await fetchJson(entry.record_url);
            if (prodEnvelope.build.commit !== expectedCommit) throw new Error(`${slug}: production build commit mismatch`);
            if (prodEnvelope.global_key !== entry.global_key) throw new Error(`${slug}: global key mismatch`);
            if (!equal(localEnvelope, prodEnvelope)) throw new Error(`${slug}: native/Series production semantic mismatch`);
            verified += 1;
          }

          for (const route of ['/platforms/', '/compare/', '/stats/', localIndex.records.at(-1).human_url]) {
            const response = await fetch(`${base}${route}`, { redirect: 'follow', headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${route}: HTTP ${response.status}`);
          }

          console.log(JSON.stringify({
            accepted_main: expectedCommit,
            registry_json: 1,
            index_json: 1,
            record_envelopes: verified,
            series_json_total: verified + 2,
            global_keys_unique: new Set(globalKeys).size,
            human_routes: 4,
            production_semantic_equality: true,
          }, null, 2));
          NODE
