name: Ledger Series Phase 9 Production One-Shot

on:
  pull_request:
    paths:
      - '.github/workflows/ledger-series-phase9-production-one-shot.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: d5ffd036f52cf4789190c95848979f76ce768423
      BASE_URL: https://cya.badjoke-lab.com
    steps:
      - name: Checkout exact accepted main
        uses: actions/checkout@v7
        with:
          ref: d5ffd036f52cf4789190c95848979f76ce768423

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild and validate exact main
        run: |
          npm test
          node scripts/validate-ledger-series-phase9-adapter.mjs

      - name: Verify production Series contract exhaustively
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL;
          const expectedCommit = process.env.SOURCE_SHA;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchJson(target) {
            const url = new URL(target, `${base}/`);
            url.searchParams.set('series_audit', String(Date.now()));
            const response = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url.pathname}: HTTP ${response.status}`);
            return response.json();
          }

          async function fetchOk(target) {
            const url = new URL(target, `${base}/`);
            url.searchParams.set('series_audit', String(Date.now()));
            const response = await fetch(url, { redirect: 'follow', headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url.pathname}: HTTP ${response.status}`);
          }

          const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

          let version;
          for (let attempt = 1; attempt <= 40; attempt += 1) {
            try {
              version = await fetchJson('/version.json');
            } catch {
              version = null;
            }
            const observed = version?.build?.commit || '';
            console.log(`production commit ${observed || 'missing'} (${attempt}/40)`);
            if (observed === expectedCommit) break;
            if (attempt === 40) throw new Error(`production did not converge to ${expectedCommit}; observed ${observed || 'missing'}`);
            await sleep(15000);
          }

          const descriptor = await fetchJson('/data/series/registry.json');
          const index = await fetchJson('/data/series/index.json');

          if (descriptor.object_type !== 'registry_descriptor') throw new Error('descriptor object_type mismatch');
          if (descriptor.registry?.id !== 'crypto-yield-archive') throw new Error('descriptor registry id mismatch');
          if (descriptor.registry?.origin !== base) throw new Error('descriptor origin mismatch');
          if (descriptor.canonical_only !== true || descriptor.data_safety?.canonical_only !== true) throw new Error('descriptor canonical-only safety mismatch');
          if (descriptor.verification?.build?.commit !== expectedCommit) throw new Error(`descriptor build commit mismatch: ${descriptor.verification?.build?.commit}`);
          if (descriptor.record_counts?.primary_records !== 118 || descriptor.record_counts?.series_records !== 118) throw new Error('descriptor record count mismatch');

          if (index.object_type !== 'record_index' || index.registry_id !== 'crypto-yield-archive') throw new Error('index identity mismatch');
          if (index.canonical_only !== true) throw new Error('index canonical-only mismatch');
          if (index.verification?.build?.commit !== expectedCommit) throw new Error(`index build commit mismatch: ${index.verification?.build?.commit}`);
          if (index.record_count !== 118 || index.records?.length !== 118) throw new Error(`expected 118 production Series records, got ${index.records?.length}`);

          const globalKeys = index.records.map((item) => item.global_record_key);
          if (new Set(globalKeys).size !== 118) throw new Error('production global-key uniqueness failed');

          let verified = 0;
          for (const entry of index.records) {
            const slug = entry.slug;
            const native = await fetchJson(entry.native_machine_url);
            const envelope = await fetchJson(entry.machine_url);

            if (envelope.object_type !== 'record_envelope') throw new Error(`${slug}: object_type mismatch`);
            if (envelope.registry_id !== 'crypto-yield-archive') throw new Error(`${slug}: registry mismatch`);
            if (envelope.global_record_key !== entry.global_record_key) throw new Error(`${slug}: global key mismatch`);
            if (envelope.record_key?.native_record_id !== entry.native_record_id || envelope.record_key?.slug !== slug) throw new Error(`${slug}: record key mismatch`);
            if (envelope.relationships?.length !== 0) throw new Error(`${slug}: Stage 3 relationships must remain empty`);
            if (envelope.provenance?.canonical_only !== true || envelope.provenance?.data_safety?.canonical_only !== true) throw new Error(`${slug}: canonical-only provenance mismatch`);
            if (envelope.verification?.build?.commit !== expectedCommit) throw new Error(`${slug}: production build commit mismatch`);

            if (!same(envelope.current_state?.native?.record, native.record)) throw new Error(`${slug}: native record loss`);
            if (!same(envelope.current_state?.native?.supporting_records, native.supporting_records)) throw new Error(`${slug}: supporting records loss`);
            if (!same(envelope.current_state?.native?.related_record_counts, native.related_record_counts)) throw new Error(`${slug}: related counts loss`);
            if (!same(envelope.events?.records, native.supporting_records?.events ?? [])) throw new Error(`${slug}: event projection mismatch`);
            if (!same(envelope.evidence?.records, native.supporting_records?.evidence ?? [])) throw new Error(`${slug}: evidence projection mismatch`);
            if (envelope.urls?.native_machine !== entry.native_machine_url || envelope.urls?.machine !== entry.machine_url || envelope.urls?.human !== entry.human_url) throw new Error(`${slug}: URL projection mismatch`);
            verified += 1;
          }

          for (const route of ['/platforms/', '/compare/', '/stats/', index.records.at(-1).human_url]) {
            await fetchOk(route);
          }

          console.log(JSON.stringify({
            accepted_main: expectedCommit,
            registry_json: 1,
            index_json: 1,
            record_envelopes: verified,
            native_dossiers_compared: verified,
            series_json_total: verified + 2,
            global_keys_unique: new Set(globalKeys).size,
            human_routes: 4,
            production_native_series_lossless: true,
          }, null, 2));
          NODE
