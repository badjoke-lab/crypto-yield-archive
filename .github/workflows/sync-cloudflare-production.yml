name: Sync Cloudflare Production Branch

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'src/**'
      - 'public/**'
      - 'functions/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/sync-cloudflare-production.yml'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cya-cloudflare-production-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Cloudflare-visible production sync commit
        env:
          CLOUDFLARE_PRODUCTION_BRANCH: agent/seo-hardening
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$CLOUDFLARE_PRODUCTION_BRANCH"
          mkdir -p public/.well-known
          printf '%s\n' "$SOURCE_SHA" > public/cya-source-commit.txt
          printf '%s\n' "$SOURCE_SHA" > public/.well-known/cya-source-commit.txt
          git add -A
          git commit --allow-empty -m "chore: sync CYA production from ${SOURCE_SHA}"
          git push --force origin "HEAD:refs/heads/${CLOUDFLARE_PRODUCTION_BRANCH}"
          echo "Source main commit: ${SOURCE_SHA}"
          echo "Cloudflare branch commit: $(git rev-parse HEAD)"
