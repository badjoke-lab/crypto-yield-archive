name: Verify Ledger Series Phase 9 Production

on:
  pull_request:
    paths:
      - ".github/workflows/verify-ledger-series-phase9-production.yml"

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout accepted current main
        uses: actions/checkout@v7
        with:
          ref: be45b87a60ae1ca87b523d0db1c6b3b5f5268ccc

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Wait for exact-main production deployment
        env:
          CYA_EXPECTED_COMMIT: be45b87a60ae1ca87b523d0db1c6b3b5f5268ccc
          CYA_SMOKE_ATTEMPTS: "24"
          CYA_SMOKE_DELAY_MS: "15000"
        run: node scripts/check-production.mjs

      - name: Verify all Series production JSON and native parity
        env:
          EXPECTED_MAIN: be45b87a60ae1ca87b523d0db1c6b3b5f5268ccc
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://cya.badjoke-lab.com';
          const expected = process.env.EXPECTED_MAIN;
          const readJson = async (route) => {
            const sep = route.includes('?') ? '&' : '?';
            const res = await fetch(`${base}${route}${sep}series_prod_verify=${Date.now()}`, {
              headers: {accept: 'application/json', 'cache-control': 'no-cache', 'user-agent': 'cya-series-production-verify/1.0'},
            });
            assert.equal(res.ok, true, `${route} HTTP ${res.status}`);
            return res.json();
          };
          const readOk = async (route) => {
            const res = await fetch(`${base}${route}?series_prod_verify=${Date.now()}`, {headers: {'cache-control': 'no-cache'}});
            assert.equal(res.ok, true, `${route} HTTP ${res.status}`);
          };
          const descriptor = await readJson('/data/series/registry.json');
          const index = await readJson('/data/series/index.json');
          assert.equal(descriptor.series_schema_version, '1.0.0');
          assert.equal(descriptor.registry.id, 'crypto-yield-archive');
          assert.equal(descriptor.canonical_only, true);
          assert.equal(descriptor.verification.build.commit, expected);
          assert.equal(index.verification.build.commit, expected);
          assert.equal(index.canonical_only, true);
          assert.equal(index.record_count, descriptor.record_counts.series_records);
          assert.equal(index.record_count, descriptor.record_counts.primary_records);
          const keys = index.records.map((record) => record.global_record_key);
          assert.equal(new Set(keys).size, keys.length, 'global record keys must be unique');
          const checkRecord = async (record) => {
            const series = await readJson(`/data/series/records/${record.slug}.json`);
            const native = await readJson(`/data/platform/${record.slug}.json`);
            assert.equal(series.global_record_key, record.global_record_key);
            assert.equal(series.record_key.native_record_id, record.native_record_id);
            assert.equal(series.record_key.slug, record.slug);
            assert.equal(series.verification.build.commit, expected);
            assert.deepEqual(series.relationships, []);
            assert.equal(series.provenance.canonical_only, true);
            assert.equal(series.provenance.data_safety.includes_unreviewed_candidates, false);
            assert.equal(series.provenance.data_safety.includes_internal_monitoring, false);
            assert.equal(series.urls.human, `${base}/platform/${record.slug}/`);
            assert.equal(series.urls.machine, `${base}/data/series/records/${record.slug}.json`);
            assert.equal(series.urls.native_machine, `${base}/data/platform/${record.slug}.json`);
            assert.deepEqual(series.current_state.native.record, native.record);
            assert.deepEqual(series.current_state.native.supporting_records, native.supporting_records);
            assert.deepEqual(series.current_state.native.related_record_counts, native.related_record_counts);
            assert.deepEqual(series.events.records, native.supporting_records.events);
            assert.deepEqual(series.evidence.records, native.supporting_records.evidence);
          };
          for (let i = 0; i < index.records.length; i += 10) {
            await Promise.all(index.records.slice(i, i + 10).map(checkRecord));
          }
          await Promise.all(['/platforms/', '/compare/', '/stats/'].map(readOk));
          console.log(JSON.stringify({
            ok: true,
            expected_main: expected,
            series_json_files: index.record_count + 2,
            record_envelopes: index.record_count,
            unique_global_keys: keys.length,
            native_parity: `${index.record_count}/${index.record_count}`,
            human_routes: ['/platforms/', '/compare/', '/stats/'],
          }, null, 2));
          NODE
