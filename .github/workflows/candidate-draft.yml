name: Candidate draft

on:
  workflow_dispatch:
    inputs:
      candidate_file:
        description: Candidate ledger to convert into review-only drafts
        required: false
        default: data-staging/candidates/cya-candidates.json
        type: string
  pull_request:
    paths:
      - data-staging/candidates/**
      - scripts/candidate-scanner.mjs
      - scripts/candidate-draft-generator.mjs
      - scripts/test-candidate-scanner.mjs
      - scripts/test-candidate-draft-generator.mjs
      - scripts/fixtures/candidate-scanner.json
      - scripts/lib/registry-files.mjs
      - package.json
      - .github/workflows/candidate-draft.yml

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run scanner and draft fixture tests
        run: |
          npm run test:candidate-scanner
          npm run test:candidate-drafts

      - name: Generate review-only candidate drafts
        shell: bash
        env:
          CANDIDATE_FILE: ${{ inputs.candidate_file || 'data-staging/candidates/cya-candidates.json' }}
        run: |
          mkdir -p artifacts/candidate-drafts
          npm run candidates:draft -- --input "$CANDIDATE_FILE" --output-dir artifacts/candidate-drafts

      - name: Upload candidate drafts
        uses: actions/upload-artifact@v4
        with:
          name: cya-candidate-drafts
          path: artifacts/candidate-drafts/
