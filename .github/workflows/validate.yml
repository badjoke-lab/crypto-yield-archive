name: Validate and build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate data quality and build
        run: npm run test

      - name: Temporary production count probe
        env:
          CYA_BASE_URL: https://cya.badjoke-lab.com
          CYA_EXPECTED_COMMIT: ''
          CYA_SMOKE_ATTEMPTS: 1
          CYA_SMOKE_DELAY_MS: 1000
        run: npm run check:production
