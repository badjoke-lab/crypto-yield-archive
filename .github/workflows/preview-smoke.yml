name: Preview Surface Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect site-output changes
        id: site_changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- \
            src \
            public \
            data \
            astro.config.mjs \
            package.json \
            package-lock.json \
            scripts/generate-build-metadata.mjs \
            scripts/check-production.mjs \
            scripts/check-production-once.mjs; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No site-output changes detected; Cloudflare preview check is not applicable."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' || steps.site_changes.outputs.required == 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.site_changes.outputs.required == 'true'
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare branch preview
        if: github.event_name == 'workflow_dispatch' || steps.site_changes.outputs.required == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          CYA_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          CYA_PREVIEW_READY_ATTEMPTS: 8
          CYA_PREVIEW_READY_DELAY_SECONDS: 10
          CYA_SMOKE_ATTEMPTS: 4
          CYA_SMOKE_DELAY_MS: 5000
        shell: bash
        run: |
          set -euo pipefail
          alias=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-28 | sed -E 's/-+$//')
          export CYA_BASE_URL="https://${alias}.crypto-yield-archive.pages.dev"

          echo "Preview URL: ${CYA_BASE_URL}" | tee preview-surface.log
          echo "Expected PR head: ${CYA_EXPECTED_COMMIT}" | tee -a preview-surface.log

          preview_ready=false
          for attempt in $(seq 1 "$CYA_PREVIEW_READY_ATTEMPTS"); do
            status=$(curl -sS -H 'cache-control: no-cache' -o /tmp/cya-preview-version.json -w '%{http_code}' "${CYA_BASE_URL}/version.json?preview_probe=$(date +%s%N)" || true)
            echo "Preview readiness ${attempt}/${CYA_PREVIEW_READY_ATTEMPTS}: /version.json HTTP ${status}" | tee -a preview-surface.log

            if [ "$status" = "404" ]; then
              echo "Cloudflare branch preview is unavailable for this PR. Local build, validation, SEO, and representative screenshot workflows remain the blocking checks." | tee -a preview-surface.log
              exit 0
            fi

            if [ "$status" != "200" ]; then
              echo "Unexpected preview response; refusing to mask a non-404 failure." | tee -a preview-surface.log
              exit 1
            fi

            deployed_commit=$(node -e "const fs=require('node:fs');try{const x=JSON.parse(fs.readFileSync('/tmp/cya-preview-version.json','utf8'));process.stdout.write(String(x.build?.commit||''))}catch{}")
            echo "Observed preview commit: ${deployed_commit:-unknown}" | tee -a preview-surface.log

            if [ "$deployed_commit" = "$CYA_EXPECTED_COMMIT" ]; then
              preview_ready=true
              break
            fi

            if [ "$attempt" -lt "$CYA_PREVIEW_READY_ATTEMPTS" ]; then
              sleep "$CYA_PREVIEW_READY_DELAY_SECONDS"
            fi
          done

          if [ "$preview_ready" != "true" ]; then
            echo "Cloudflare branch alias exists but did not deploy this PR head. Treating the stale preview as unavailable; local build, validation, SEO, and representative screenshot workflows remain the blocking checks." | tee -a preview-surface.log
            exit 0
          fi

          set -o pipefail
          npm run check:production 2>&1 | tee -a preview-surface.log

      - name: Record non-applicable preview check
        if: github.event_name == 'pull_request' && steps.site_changes.outputs.required == 'false'
        run: |
          echo "Preview check skipped: this pull request changes CI visual-review files only." | tee preview-surface.log

      - name: Upload preview diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cya-preview-surface-log
          path: preview-surface.log
