name: Temporary CYA Production Probe

on:
  push:
    branches:
      - agent/cya-cloudflare-production-sync

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Probe current production counts and routes
        env:
          CYA_BASE_URL: https://cya.badjoke-lab.com
          CYA_EXPECTED_COMMIT: ''
          CYA_SMOKE_ATTEMPTS: 12
          CYA_SMOKE_DELAY_MS: 15000
        run: npm run check:production
