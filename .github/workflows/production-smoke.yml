name: Production Surface Check

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: cya-production-surface
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check production after Cloudflare deployment
        env:
          CYA_BASE_URL: https://cya.badjoke-lab.com
          CYA_EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
          CYA_SMOKE_ATTEMPTS: 48
          CYA_SMOKE_DELAY_MS: 15000
        run: npm run check:production
