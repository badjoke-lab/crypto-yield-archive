name: Production Surface Check

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: cya-production-surface
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve deployed commit expectation
        id: deployment
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "commit=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet HEAD^ HEAD -- \
            data \
            src \
            public \
            functions \
            scripts \
            astro.config.mjs \
            package.json \
            package-lock.json \
            tsconfig.json; then
            echo "commit=" >> "$GITHUB_OUTPUT"
          else
            echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check production after Cloudflare deployment
        env:
          CYA_BASE_URL: https://cya.badjoke-lab.com
          CYA_EXPECTED_COMMIT: ${{ steps.deployment.outputs.commit }}
          CYA_SMOKE_ATTEMPTS: 48
          CYA_SMOKE_DELAY_MS: 15000
        run: npm run check:production
