name: Production Smoke Check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check production endpoints
        run: npm run check:production
