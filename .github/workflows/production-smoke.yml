name: Production Surface Check

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'src/**'
      - 'public/**'
      - 'functions/**'
      - 'scripts/**'
      - 'docs/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  checks: read
  issues: write

concurrency:
  group: cya-production-surface
  cancel-in-progress: true

# Production authority:
# - Cloudflare Pages Git integration deploys main.
# - This workflow verifies that Cloudflare reports success and the custom-domain
#   version.json serves the exact pushed commit before accepting production.
# - No repository Cloudflare API token is required for normal publication.
# - The newest canonical platform must resolve on both human and machine routes.
# - Production verification is intentionally exercised through a normal PR merge.

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout production source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Wait for Cloudflare main deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          PRODUCTION_VERSION_URL: https://cya.badjoke-lab.com/version.json
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            check_json="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Cloudflare Pages")] | sort_by(.started_at) | last // {}')"
            check_status="$(jq -r '.status // "missing"' <<<"${check_json}")"
            check_conclusion="$(jq -r '.conclusion // "pending"' <<<"${check_json}")"
            deployed_commit="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "${PRODUCTION_VERSION_URL}?audit=${attempt}" 2>/dev/null | jq -r '.build.commit // empty' 2>/dev/null || true)"
            echo "Cloudflare main ${SOURCE_SHA}: status=${check_status} conclusion=${check_conclusion} deployed_commit=${deployed_commit:-missing} (${attempt}/120)."

            if [[ "${check_status}" == "completed" && "${check_conclusion}" == "success" && "${deployed_commit}" == "${SOURCE_SHA}" ]]; then
              ready=1
              break
            fi

            if [[ "${check_status}" == "completed" && "${check_conclusion}" != "success" ]]; then
              echo "Cloudflare main deployment failed with conclusion ${check_conclusion}." >&2
              exit 1
            fi

            sleep 15
          done

          if [[ "${ready}" != "1" ]]; then
            echo "Cloudflare custom domain did not serve the expected main commit before timeout." >&2
            exit 1
          fi

      - name: Check current production surface
        env:
          CYA_BASE_URL: https://cya.badjoke-lab.com
          CYA_EXPECTED_COMMIT: ${{ github.sha }}
          CYA_EXPECTED_SOURCE_COMMIT: ''
          CYA_SMOKE_ATTEMPTS: 12
          CYA_SMOKE_DELAY_MS: 15000
        run: npm run check:production

      - name: Verify newest canonical human and machine routes
        shell: bash
        env:
          CYA_BASE_URL: https://cya.badjoke-lab.com
        run: |
          set -euo pipefail
          latest_json="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files=fs.readdirSync('data').filter((f)=>f==='platforms.json'||(f.startsWith('platforms-batch-')&&f.endsWith('.json')));
          const rows=files.flatMap((f)=>JSON.parse(fs.readFileSync(path.join('data',f),'utf8')));
          rows.sort((a,b)=>Number(String(a.id).match(/(\d+)$/)?.[1]||0)-Number(String(b.id).match(/(\d+)$/)?.[1]||0));
          const latest=rows.at(-1);
          if(!latest?.slug||!latest?.id) process.exit(1);
          console.log(JSON.stringify({id:latest.id,slug:latest.slug}));
          NODE
          )"
          latest_id="$(jq -r '.id' <<<"$latest_json")"
          latest_slug="$(jq -r '.slug' <<<"$latest_json")"
          echo "Verifying newest canonical platform ${latest_id} / ${latest_slug}"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${CYA_BASE_URL}/platform/${latest_slug}/?production_audit=${GITHUB_RUN_ID}" >/tmp/latest-platform.html
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${CYA_BASE_URL}/data/platform/${latest_slug}.json?production_audit=${GITHUB_RUN_ID}" >/tmp/latest-platform.json
          jq -e --arg id "$latest_id" --arg slug "$latest_slug" '.canonical_only == true and .record_key.platform_id == $id and .record_key.slug == $slug and .record.id == $id and .record.slug == $slug' /tmp/latest-platform.json >/dev/null
          grep -Fq "/data/platform/${latest_slug}.json" /tmp/latest-platform.html || grep -Fq "$latest_slug" /tmp/latest-platform.html

      - name: Install Chromium for production screenshots
        run: |
          npm install --no-save --ignore-scripts playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Capture production desktop and mobile pages
        env:
          CAPTURE_BASE_URL: https://cya.badjoke-lab.com
        run: node scripts/capture-representative-pages.mjs

      - name: Upload production UI verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cya-production-ui-verification-${{ github.run_id }}
          path: artifacts/representative-visual-review/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Report production publication result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 323,
              body: `Production Surface Check finished.\n\n- Result: **${{ job.status }}**\n- Source commit: \`${context.sha}\`\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
